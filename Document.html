<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title> <!-- Boring title -->
    <style>
        body { margin: 0; padding: 0; background: #fff; font-family: Arial, sans-serif; }
        .container { max-width: 600px; margin: 50px auto; text-align: center; padding: 20px; }
        input[type="text"] { width: 70%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; margin-right: 10px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        iframe { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none; z-index: 9999; }
        .loader { display: none; margin-top: 10px; color: #666; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="container">
        <h3 style="color: #333;">Enter URL</h3>
        <input type="text" id="urlInput" placeholder="https://example.com">
        <button onclick="bypass()">Go</button>
        <div class="loader" id="loader">Loading...</div>
    </div>

    <iframe id="proxyFrame"></iframe>

    <script>
        function bypass() {
            let url = document.getElementById('urlInput').value;
            if (!url) return alert("Enter a URL");
            
            // Add https if missing
            if (!url.startsWith('http')) {
                url = 'https://' + url;
            }

            const loader = document.getElementById('loader');
            const frame = document.getElementById('proxyFrame');
            
            loader.style.display = 'block';
            
            // Load in hidden iframe first to check load
            frame.src = url;
            frame.onload = function() {
                loader.style.display = 'none';
                frame.style.display = 'block';
            };
            
            // Fallback timeout
            setTimeout(() => {
                if(frame.style.display === 'none') {
                    loader.innerText = "Error loading site";
                }
            }, 5000);
        }
    </script>
</body>
</html>
