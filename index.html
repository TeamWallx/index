<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sh.sh.abrdns.com - Terminal</title>
  <style>
    :root {
      --bg: #0c0d10;
      --panel: #16181d;
      --border: #262931;
      --text: #e6edf3;
      --dim: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --red: #f85149;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Consolas', 'Courier New', monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Bar with Host and Model controls */
    .header-bar {
      background-color: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }

    .config-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .config-group label {
      color: var(--dim);
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .config-group input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 10px;
      font-family: inherit;
      font-size: 0.85rem;
      border-radius: 4px;
      outline: none;
      transition: border-color 0.2s;
    }

    .config-group input:focus {
      border-color: var(--accent);
    }

    .status-badge {
      margin-left: auto;
      font-size: 0.8rem;
      color: var(--dim);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--green);
      display: inline-block;
    }

    /* Terminal Console Area */
    #terminal {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .line { word-break: break-word; }
    .line.user { color: var(--accent); }
    .line.bot { color: var(--text); }
    .line.sys { color: var(--dim); font-style: italic; }
    .line.error { color: var(--red); }

    pre {
      background: #111318;
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 8px 0;
    }

    code { font-family: inherit; }

    /* Input Footer */
    .input-bar {
      border-top: 1px solid var(--border);
      background-color: var(--panel);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .prompt-symbol {
      color: var(--accent);
      font-weight: bold;
    }

    #cmdInput {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      outline: none;
    }
  </style>
</head>
<body>

  <!-- Top Configuration Header -->
  <div class="header-bar">
    <div class="config-group">
      <label for="hostInput">HOST:</label>
      <input type="text" id="hostInput" style="width: 320px;" placeholder="https://xxxx.trycloudflare.com" />
    </div>
    
    <div class="config-group">
      <label for="modelInput">MODEL:</label>
      <input type="text" id="modelInput" style="width: 130px;" placeholder="llama3" />
    </div>

    <div class="status-badge">
      <span class="status-dot"></span> READY
    </div>
  </div>

  <!-- Terminal Output Screen -->
  <div id="terminal">
    <div class="line sys">[SH.SH.ABRDNS.COM TERMINAL ONLINE]</div>
    <div class="line sys">Connected to local Ollama runner via Cloudflare Tunnel. Type /clear to reset screen.</div>
  </div>

  <!-- Bottom Command Input Line -->
  <div class="input-bar">
    <span class="prompt-symbol">$</span>
    <input type="text" id="cmdInput" placeholder="Enter prompt or command..." autofocus />
  </div>

  <script>
    const terminal = document.getElementById('terminal');
    const cmdInput = document.getElementById('cmdInput');
    const hostInput = document.getElementById('hostInput');
    const modelInput = document.getElementById('modelInput');

    // Default Tunnel Host & Model persistence
    const defaultHost = 'https://biblical-artwork-describes-charging.trycloudflare.com';
    const defaultModel = 'llama3';

    hostInput.value = localStorage.getItem('abrdns_host') || defaultHost;
    modelInput.value = localStorage.getItem('abrdns_model') || defaultModel;

    // Auto-save changes to localStorage
    hostInput.addEventListener('change', () => {
      localStorage.setItem('abrdns_host', hostInput.value.trim());
      printLine(`[SYS] Host updated to: ${hostInput.value.trim()}`, 'sys');
    });

    modelInput.addEventListener('change', () => {
      localStorage.setItem('abrdns_model', modelInput.value.trim());
      printLine(`[SYS] Model updated to: ${modelInput.value.trim()}`, 'sys');
    });

    // Handle command submissions
    cmdInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const val = cmdInput.value.trim();
        if (!val) return;
        cmdInput.value = '';

        if (val === '/clear') {
          terminal.innerHTML = '';
          return;
        }

        printLine(`$ ${val}`, 'user');
        sendPrompt(val);
      }
    });

    function printLine(text, type = 'bot') {
      const div = document.createElement('div');
      div.className = `line ${type}`;

      if (type === 'bot') {
        div.innerHTML = parseMarkdown(text);
      } else {
        div.innerText = text;
      }

      terminal.appendChild(div);
      terminal.scrollTop = terminal.scrollHeight;
      return div;
    }

    async function sendPrompt(promptText) {
      const host = hostInput.value.trim().replace(/\/$/, '');
      const model = modelInput.value.trim();

      if (!host) {
        printLine('Error: Host URL is empty. Please specify a host above.', 'error');
        return;
      }

      const loader = printLine('processing request...', 'sys');

      try {
        const response = await fetch(`${host}/api/generate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: model,
            prompt: promptText,
            stream: false
          })
        });

        loader.remove();

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          printLine(`API Error (${response.status}): ${errData.error || 'Failed to communicate with Ollama host.'}`, 'error');
          return;
        }

        const data = await response.json();
        printLine(data.response || '[No output returned]', 'bot');

      } catch (err) {
        loader.remove();
        printLine(`Connection Failed: ${err.message}. Ensure Ollama is running with CORS enabled ($env:OLLAMA_ORIGINS="*").`, 'error');
      }
    }

    function parseMarkdown(str) {
      return str
        .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');
    }
  </script>
</body>
</html>
